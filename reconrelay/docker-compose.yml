services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 384m

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      RR_USE_MEMORY_STORE: "false"
      RR_INLINE_WORKER: "false"
      RR_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # Nginx runs on the host and is the only public web entry point.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 768m

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      RR_USE_MEMORY_STORE: "false"
      RR_INLINE_WORKER: "false"
      RR_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.runner"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m

volumes:
  redis-data:
