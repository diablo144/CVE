<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ReconRelay</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0d1117;
        color: #e6edf3;
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: grid;
        grid-template-columns: 1fr 320px;
        grid-template-rows: 40px 1fr;
        height: 100vh;
      }
      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        border-bottom: 1px solid #30363d;
        background: #161b22;
      }
      h1 { font-size: 13px; margin: 0; }
      #status { color: #8b949e; }
      button {
        background: #21262d; color: #e6edf3; border: 1px solid #30363d;
        border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer;
      }
      button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
      select { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 4px; font: inherit; }
      #graph-wrap { position: relative; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      aside {
        border-left: 1px solid #30363d;
        background: #0d1117;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8b949e; margin: 10px 12px 6px; }
      #filters { padding: 0 12px; display: flex; flex-wrap: wrap; gap: 6px; }
      #filters label { font-size: 11px; color: #8b949e; }
      #detail { padding: 8px 12px; border-top: 1px solid #30363d; overflow: auto; }
      #detail pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; margin: 0; color: #8b949e; }
      #legend { padding: 8px 12px; border-top: 1px solid #30363d; overflow-y: auto; flex: 1; }
      .row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 11px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      #empty { padding: 12px; color: #8b949e; }
    </style>
  </head>
  <body>
    <header>
      <h1>ReconRelay</h1>
      <span id="status">idle</span>
      <span style="flex:1"></span>
      <select id="preset">
        <option value="passive">passive</option>
        <option value="recon" selected>recon</option>
        <option value="active">active</option>
      </select>
      <button id="scan" class="primary">Scan inspected page</button>
      <button id="fit">Fit</button>
      <button id="clear">Clear</button>
    </header>

    <div id="graph-wrap">
      <canvas id="graph"></canvas>
    </div>

    <aside>
      <h2>Selected node</h2>
      <div id="detail"><pre>Click a node to inspect it.</pre></div>
      <h2>Event types</h2>
      <div id="filters"></div>
      <div id="legend"><div id="empty">No events yet.</div></div>
    </aside>

    <script type="module" src="panel.js"></script>
  </body>
</html>
