# Host Nginx config for the Docker Compose deployment.
# Replace recon.example.com and install a valid certificate before enabling TLS.
# The WS location deliberately disables access logging because the short-lived
# JWT is passed in the WebSocket query string by browser APIs.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream reconrelay_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name recon.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name recon.example.com;

    ssl_certificate     /etc/letsencrypt/live/recon.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recon.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /v1/ws/ {
        access_log off;
        proxy_pass http://reconrelay_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://reconrelay_api;
        proxy_set_header Connection "";
    }
}
